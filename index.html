<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tasa BCV</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCV Dólar">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --success-color: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .rate-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .rate-box .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rate-box .value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 4px 0;
    }

    .rate-box .date-applied {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-header label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .live-preview {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--success-color);
      background-color: rgba(74, 222, 128, 0.1);
      padding: 2px 8px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .live-preview.visible {
      opacity: 1;
    }

    input[type="number"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1.15rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent-color);
    }

    .refresh-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .refresh-btn:active {
      opacity: 0.8;
    }

    .status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Calculadora Dólar BCV</h1>
      <span id="statusBadge" class="badge">Conectando...</span>
    </header>

    <main class="card">
      <div class="rate-box">
        <div class="label">Tasa Celda D1</div>
        <div class="value" id="rateDisplay">--.--</div>
        <div class="date-applied" id="dateAppliedDisplay">Obteniendo valor...</div>
      </div>

      <!-- Conversión USD -> VES -->
      <div class="field-group">
        <div class="field-header">
          <label for="usdInput">Dólares ($ USD)</label>
          <span id="usdLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="usdInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <!-- Conversión VES -> USD -->
      <div class="field-group">
        <div class="field-header">
          <label for="vesInput">Bolívares (Bs. VES)</label>
          <span id="vesLivePreview" class="live-preview"></span>
        </div>
        <input type="number" id="vesInput" placeholder="0.00" step="any" inputmode="decimal">
      </div>

      <button type="button" id="btnRefresh" class="refresh-btn">🔄 Actualizar Tasa</button>
    </main>

    <div class="status" id="footerStatus">Conectado a Google Sheets</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwWAQDN-ymAmOlnWm1haSAtjL5JayIKKQ_jukTdfldbbN2E8HcEtzLHaasw7I1jziGB/exec";

    let currentActiveRate = 0;

    const usdInput = document.getElementById('usdInput');
    const vesInput = document.getElementById('vesInput');
    const usdLivePreview = document.getElementById('usdLivePreview');
    const vesLivePreview = document.getElementById('vesLivePreview');
    const rateDisplay = document.getElementById('rateDisplay');
    const dateAppliedDisplay = document.getElementById('dateAppliedDisplay');
    const statusBadge = document.getElementById('statusBadge');
    const btnRefresh = document.getElementById('btnRefresh');

    document.addEventListener('DOMContentLoaded', () => {
      // Cargar caché local
      const cachedRate = localStorage.getItem('bcv_rate_d1');
      if (cachedRate) {
        currentActiveRate = parseFloat(cachedRate);
        rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
        statusBadge.textContent = "Caché Local";
      }

      obtenerTasaD1();
    });

    async function obtenerTasaD1() {
      statusBadge.textContent = "Cargando...";
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data && data.tasa) {
          // Convertir el valor de la celda a número (por si llega formateado con comas o texto)
          let rawValue = data.tasa.toString().replace(',', '.');
          currentActiveRate = parseFloat(rawValue);

          if (!isNaN(currentActiveRate)) {
            rateDisplay.textContent = `${currentActiveRate.toFixed(2)} Bs.`;
            dateAppliedDisplay.textContent = `Actualizado: ${data.fecha || 'Hoy'}`;
            statusBadge.textContent = "Conectado";
            localStorage.setItem('bcv_rate_d1', currentActiveRate);
            
            recalcularLive('usd');
          } else {
            rateDisplay.textContent = "Error";
            dateAppliedDisplay.textContent = "El valor en D1 no es un número válido";
          }
        }
      } catch (error) {
        console.error("Error obteniendo D1:", error);
        statusBadge.textContent = "Sin conexión";
        if (currentActiveRate > 0) {
          dateAppliedDisplay.textContent = "Usando última tasa guardada";
        }
      }
    }

    function recalcularLive(origen) {
      if (currentActiveRate <= 0) return;

      if (origen === 'usd') {
        const valUSD = parseFloat(usdInput.value);
        if (!isNaN(valUSD) && valUSD > 0) {
          const resultadoBs = valUSD * currentActiveRate;
          vesInput.value = resultadoBs.toFixed(2);
          
          usdLivePreview.textContent = `= ${resultadoBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Bs.`;
          usdLivePreview.classList.add('visible');
          vesLivePreview.classList.remove('visible');
        } else {
          vesInput.value = '';
          usdLivePreview.classList.remove('visible');
        }
      } else if (origen === 'ves') {
        const valVES = parseFloat(vesInput.value);
        if (!isNaN(valVES) && valVES > 0) {
          const resultadoUSD = valVES / currentActiveRate;
          usdInput.value = resultadoUSD.toFixed(2);
          
          vesLivePreview.textContent = `= $${resultadoUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
          vesLivePreview.classList.add('visible');
          usdLivePreview.classList.remove('visible');
        } else {
          usdInput.value = '';
          vesLivePreview.classList.remove('visible');
        }
      }
    }

    usdInput.addEventListener('input', () => recalcularLive('usd'));
    vesInput.addEventListener('input', () => recalcularLive('ves'));
    btnRefresh.addEventListener('click', obtenerTasaD1);
  </script>
  <script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrado con éxito:', reg.scope))
          .catch(err => console.error('Error al registrar SW:', err));
      });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbwWAQDN-ymAmOlnWm1haSAtjL5JayIKKQ_jukTdfldbbN2E8HcEtzLHaasw7I1jziGB/exec";
    // ... resto de tu JavaScript actual ...
  </script>
</body>
</body>
</html>
